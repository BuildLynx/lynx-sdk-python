# Generative AI was used in the Creation/Modification of this file.

[project]
name = "lynx-sdk"
version = "00.01.01"
description = "Lynx gives your sensors personality."
authors = [{name = "Kenny Kim", email = "wave@kenneth.kim"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "jsonschema",
    "orjson",
    "paho-mqtt",
    "xxhash"
]

[project.optional-dependencies]
cli = [
    "typer",
    "jinja2",
    "rich",
    "markdown",
    "weasyprint",
]
testing = [
    "pytest-sugar",
]
dev = [
    "import-linter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lynx_sdk = ["cli/docker/templates/*.j2"]

[project.scripts]
lynx = "lynx_sdk.cli.main:app"

[tool.importlinter]
root_package = "lynx_sdk"

[[tool.importlinter.contracts]]
name = "Lynx layers"
type = "layers"
layers = [
    "lynx_sdk.cli",
    "lynx_sdk.core",
    "lynx_sdk.runtime",
    "lynx_sdk.messaging",
    "lynx_sdk.protocol",
]
